x-coverage:
  state: covered
  reason: covered
  detail: >-
    Every surface claimed in this profile was probed without credentials on 2026-09-01 and answered.
    AUB operates no developer portal and authors no API contract, so nothing is saved under
    openapi/ — the correct outcome for this institution, not a coverage failure. What it does
    operate is standards-based software on its own hosts, and all of it was verified: the DSpace 9.1
    REST root and OAI-PMH Identify at scholarworks.aub.edu.lb both return 200 with AUB's own
    repository identity, the Shibboleth IdP metadata at idp.aub.edu.lb returns a signed SAML 2.0
    EntityDescriptor scoped aub.edu.lb, that same entityID resolves in the InCommon MDQ service with
    registrationAuthority https://incommon.org, and the AUB-hosted Moodle answers both a Web
    Services REST call and an LTI 1.3 JWKS request. Registry memberships were confirmed against the
    registries themselves rather than from AUB's own claims: Crossref member 13566, Handle prefix
    10938, ROR 04pznsd21. DataCite was checked and AUB has no provider or client record. Two hosts
    were probed and found not to be surfaces: api.aub.edu.lb resolves but returns 403 from IIS with
    no service behind it, and sis.aub.edu.lb (Ellucian Banner on Oracle Cloud) returns a bare Tomcat
    404. aub.primo.exlibrisgroup.com returns a Primo SPA shell identical for every view id tried, so
    the tenancy is evidenced by the AUB-specific CNAME into Ex Libris eu06 — a negative control on a
    nonsense subdomain does not resolve — rather than by the 200.
