apis:
  - aid: aub:scholarworks-rest
    name: AUB ScholarWorks DSpace REST API
    description: >-
      Public RESTful (HAL) API for the AUB ScholarWorks institutional
      repository, running on DSpace 9.1. Exposes communities, collections,
      items, bitstreams, discovery/search, and metadata over HTTP/JSON. The
      service root self-describes as repository "AUB ScholarWorks".
    humanURL: https://scholarworks.aub.edu.lb/
    baseURL: https://scholarworks.aub.edu.lb/server/api
    tags: [ Repository, DSpace, Research, Open Access, Libraries, REST ]
    properties:
      - type: Documentation
        url: https://aub.edu.lb.libguides.com/AUB-Scholarworks
      - type: Documentation
        url: https://wiki.lyrasis.org/display/DSDOC9x/REST+API
  - aid: aub:scholarworks-oai
    name: AUB ScholarWorks OAI-PMH
    description: >-
      OAI-PMH 2.0 metadata harvesting endpoint for the AUB ScholarWorks
      institutional repository (DSpace 9.1). Supports the standard OAI verbs
      (Identify, ListRecords, ListSets, GetRecord, etc.) and exposes scholarly
      output of the AUB community for harvesting by aggregators.
    humanURL: https://scholarworks.aub.edu.lb/
    baseURL: https://scholarworks.aub.edu.lb/server/oai/request
    tags: [ OAI-PMH, Metadata, Harvesting, Repository, Open Access, Libraries ]
    properties:
      - type: Documentation
        url: https://aub.edu.lb.libguides.com/AUB-Scholarworks
  - aid: aub:shibboleth-idp
    name: AUB Shibboleth Identity Provider (SAML 2.0)
    description: >-
      AUB's institutional single sign-on is provided by a Shibboleth SAML 2.0
      identity provider. The SAML metadata is published at the entity endpoint
      and is used to federate access to AUB web services. This is an
      authentication/identity standard endpoint rather than a public data API.
    humanURL: https://servicedesk.aub.edu.lb/TDClient/Requests/ServiceDet?ID=30424
    baseURL: https://idp.aub.edu.lb/idp/shibboleth
    tags: [ Identity, Authentication, SAML, Shibboleth, SSO ]
    properties:
      - type: Documentation
        url: https://servicedesk.aub.edu.lb/TDClient/Requests/ServiceDet?ID=30424
