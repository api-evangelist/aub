---
aid: aub
name: American University of Beirut
description: >-
  The American University of Beirut (AUB) is a private research university in
  Beirut, Lebanon, founded in 1866, and ranked #250 in the QS World University
  Rankings 2025. AUB's public, machine-readable developer footprint is centered
  on its University Libraries: the AUB ScholarWorks institutional repository runs
  on DSpace 9.1, which exposes a public RESTful API and an OAI-PMH 2.0 metadata
  harvesting endpoint. Authentication across AUB web services is provided by a
  Shibboleth SAML 2.0 identity provider. AUB does not publish a centralized
  developer portal; most other institutional systems (SIS, service desk) are
  gated behind SSO and are not publicly documented APIs.
