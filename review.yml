  - date: '2026-06-03'
    rating: 3
    summary: >-
      AUB has no centralized developer portal, but its University Libraries
      expose real, standards-based machine-readable interfaces. Verified live:
      the AUB ScholarWorks institutional repository runs DSpace 9.1 with a
      public HAL REST API at /server/api and an OAI-PMH 2.0 endpoint at
      /server/oai/request (repositoryName "AUB ScholarWorks", adminEmail
      scholarworks@aub.edu.lb, earliest datestamp 2012). A Shibboleth SAML 2.0
      identity provider serves SSO with published metadata. Legacy DSpace paths
      (/oai/request, /rest/) return 404, consistent with DSpace 7+ which moved
      these under /server. No fabricated endpoints; SIS and service-desk systems
      are SSO-gated and not publicly documented APIs.
    endpoints:
