description: >-
  The American University of Beirut is a private, non-profit research university in Beirut, Lebanon,
  chartered in New York State and founded in 1866. AUB publishes no developer portal, no API gateway
  and no institution-authored API contract of any kind — every machine-readable surface it operates
  is a standards-based deployment of third-party software running on AUB's own hosts, and that
  distinction is the whole of this profile. Four such surfaces were verified live on 2026-09-01. AUB
  ScholarWorks (scholarworks.aub.edu.lb) is an AUB-hosted DSpace 9.1 institutional repository holding
  24,318 items across 25 communities, serving an anonymous HAL/JSON REST API and an OAI-PMH 2.0
  endpoint with thirteen metadata formats. AUB runs its own Shibboleth SAML 2.0 identity provider at
  idp.aub.edu.lb, scoped aub.edu.lb, and — the strongest institution-operated surface it has — that
  IdP is registered in InCommon and resolvable through the InCommon MDQ service with the REFEDS
  Sirtfi entity category asserted. AUB's learning management system is an AUB-hosted Moodle at
  lms.aub.edu.lb whose Web Services REST endpoint answers anonymously with a structured invalidtoken
  error and whose LTI 1.3 platform JWKS and token endpoints are publicly reachable. AUB is a Crossref
  member (id 13566, prefix 10.63014), holds Handle prefix 10938 and is registered in ROR as
  04pznsd21. Its library discovery and management stack (Ex Libris Primo and Alma), its LibGuides
  estate (Springshare, site 4901) and its Ellucian Banner student information system are vendor
  tenancies recorded here as relationships, with no vendor contract saved under AUB's name.
